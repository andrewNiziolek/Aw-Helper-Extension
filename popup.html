					<div class="ratingDiv" id="ratingBox">

						<p class="ratingText" id="ratingData">Ease rating is based upon technical ability.</p>
					</div>
				</div>

				<fieldset class="field_set" id="clipboard">
					<div class="clipDiv">
						<input type="text" id="clipMID" placeholder="Merchant ID" class="clipInput">
						<input type="text" id="clipCR" placeholder="Commission Rate" class="clipInput">
						<input type="text" id="clipNF" placeholder="Network Fee" class="clipInput">
						<button type="button" class="append-button" id="clearClipBtn">Clear</button>				
					</div>
				</fieldset>
				<script src="/scripts/clipSaver.js"></script>

				<button class="collapsible" id="newImplView">
					<span class="collapsible-label">New Implementation</span>
					<span class="collapsible-icon">+</span>
				</button>
					<div class="collapse-content">
						<body class="upper">
							<p>Please enter the new MID.</p>
						</body>
						<body class="lower">
							<div class="newImplDiv">
								<input type="text" id="implMIDBox" placeholder="Merchant ID" class="clipInput">
								<button type="button" class="append-button" id="newImplBtn">Go</button>	
							</div>
						</body>
					</div>

				<button class="collapsible" id="intReviewView">
					<span class="collapsible-label">Internal Review</span>
					<span class="collapsible-icon">+</span>
				</button>	
					<div class="collapse-content">
						<body class="upper">
							<p>Please enter an MID.</p>
						</body>
						<body class="lower">
							<div class="intReviewDiv">
								<input type="text" id="inRevMIDBox" placeholder="Merchant ID" class="clipInput">
								<button type="button" class="append-button" id="intRevBtn">Go</button>	
							</div>
						</body>
					</div>

				<button class="collapsible" id="testURLView">
					<span class="collapsible-label">Test URL Generator</span>
					<span class="collapsible-icon">+</span>
				</button>				  
					<div class="collapse-content">
						<body class="upper">
							<p>Enter an MID to generate a test URL.</p>
						</body>
						<body class="upper">
							<div class="testURLDiv">
								<input type="text" id="testURLMID" placeholder=" Merchant ID" class="clipInput">
								<button type="button" class="append-button" id="testURLBtn">Go</button>	
							</div>
						</body>
					</div>
